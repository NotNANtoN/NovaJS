#cloud-config
package_update: true
packages:
  - ca-certificates
  - curl
  - docker-compose-v2
  - docker.io
  - jq
  - s3cmd
  - ufw
  - unattended-upgrades
  - zstd

write_files:
  - path: /opt/novajs/docker-compose.yml
    owner: root:root
    permissions: '0644'
    encoding: b64
    content: '@COMPOSE_B64@'
  - path: /opt/novajs/Caddyfile
    owner: root:root
    permissions: '0644'
    encoding: b64
    content: '@CADDYFILE_B64@'
  - path: /opt/novajs/scripts/fetch_nova_data.sh
    owner: root:root
    permissions: '0755'
    encoding: b64
    content: '@FETCH_B64@'
  - path: /opt/novajs/scripts/render_caddyfile.sh
    owner: root:root
    permissions: '0755'
    encoding: b64
    content: '@RENDER_CADDY_B64@'
  - path: /opt/novajs/scripts/novajs-updater.sh
    owner: root:root
    permissions: '0755'
    encoding: b64
    content: '@UPDATER_B64@'
  - path: /opt/novajs/scripts/backup_player_data.sh
    owner: root:root
    permissions: '0755'
    encoding: b64
    content: '@BACKUP_B64@'
  - path: /etc/systemd/system/novajs-updater.service
    owner: root:root
    permissions: '0644'
    encoding: b64
    content: '@SERVICE_B64@'
  - path: /etc/systemd/system/novajs-updater.timer
    owner: root:root
    permissions: '0644'
    encoding: b64
    content: '@TIMER_B64@'
  - path: /etc/systemd/system/novajs-player-backup.service
    owner: root:root
    permissions: '0644'
    encoding: b64
    content: '@BACKUP_SERVICE_B64@'
  - path: /etc/systemd/system/novajs-player-backup.timer
    owner: root:root
    permissions: '0644'
    encoding: b64
    content: '@BACKUP_TIMER_B64@'
  - path: /opt/novajs/.env.template
    owner: root:root
    permissions: '0600'
    content: |
      NOVA_IMAGE=@NOVA_IMAGE@
      NOVA_DATA_DIR=/var/lib/novajs/Nova_Data

      # Left empty, the updater fills this with the instance's own public IPv4
      # so HTTPS comes up unattended. Set a real hostname to override. HTTP
      # always remains up either way.
      CADDY_HOSTNAME=
      CADDY_BASIC_AUTH_USER=
      CADDY_BASIC_AUTH_HASH=

      NOVA_PLAYER_BACKUP_PREFIX=novajs/player-backups
      NOVA_PLAYER_BACKUP_RETENTION_DAYS=14

      # The retail game data stays on the host and is never put in the image.
      NOVA_DATA_URL=
      NOVA_DATA_SHA256=@NOVA_DATA_SHA256@
      LINODE_BASE_URL=@LINODE_BASE_URL@
      LINODE_REGION=@LINODE_REGION@
      LINODE_BUCKET_NAME=@LINODE_BUCKET_NAME@
      LINODE_OBJECT_NAME=@LINODE_OBJECT_NAME@
      LINODE_BUCKET_KEY=@LINODE_BUCKET_KEY@
      LINODE_SECRET_KEY=@LINODE_SECRET_KEY@
  - path: /etc/ssh/sshd_config.d/novajs-bootstrap.conf
    owner: root:root
    permissions: '0644'
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password

runcmd:
  - [bash, -c, 'set -eu; install -d -m 0755 /opt/novajs/scripts /var/lib/novajs']
  # Key-only root access for reading cloud-init and updater logs. The trusted
  # keys come from the deploying GitHub account, so nothing is hand-installed.
  - [bash, -c, 'set -eu; install -d -m 0700 /root/.ssh; if curl --fail --silent --show-error --max-time 30 "@ADMIN_SSH_KEYS_URL@" -o /tmp/admin_keys && [ -s /tmp/admin_keys ]; then install -m 0600 /tmp/admin_keys /root/.ssh/authorized_keys; fi; rm -f /tmp/admin_keys']
  - [bash, -c, 'if [ ! -e /opt/novajs/.env ]; then install -m 0600 /opt/novajs/.env.template /opt/novajs/.env; fi']
  - [systemctl, enable, --now, docker]
  - [systemctl, daemon-reload]
  - [bash, -c, 'systemctl reload ssh 2>/dev/null || true']
  - [ufw, default, deny, incoming]
  - [ufw, default, allow, outgoing]
  - [ufw, allow, 22/tcp]
  - [ufw, allow, 80/tcp]
  - [ufw, allow, 443/tcp]
  - [ufw, --force, enable]
  - [systemctl, enable, novajs-updater.timer]
  - [systemctl, start, novajs-updater.timer]
  - [systemctl, enable, --now, novajs-player-backup.timer]
