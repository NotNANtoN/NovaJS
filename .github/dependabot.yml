    target-branch: "feat-performance-and-modernization"
    schedule:
      interval: "daily"
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "feat-performance-and-modernization"
    schedule:
      interval: "daily"
  - package-ecosystem: "github-actions"
    directory: "/"
